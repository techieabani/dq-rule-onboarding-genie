[project]
name = "agentic-dq-rule-onboarding"
version = "0.1.0"
description = "data quality rule onboarding genie using agentic framework"
readme = "README.md"
requires-python = ">=3.10"
# This tells uv to treat the src directory as a package source
packages = [{ include = "src" }]
dependencies = [
    "torch==2.3.1",
    "numpy<2",
    "transformers==4.57.6",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.25.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "fastapi>=0.128.0",
    "fastmcp>=2.14.2",
    "google-adk>=1.14.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "streamlit>=1.52.2",
    "uvicorn>=0.40.0",
    "nvidia-ml-py>=12.0.0",
    "litellm>=1.40.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.12.0",
    "pytest>=7.4.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

